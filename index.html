<!doctype html>
<html lang="he" dir="rtl">
<head>

<title>איתור שמנים ונוזלים לפי מספר רכב</title>

<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--card:#111014;--line:#2a2419;--txt:#f3ede2;--mut:#a59c8a;--gold:#d8b86a;--gold2:#f3dfa8;--gold3:#9c7a35;--warn:#f0b54a;--bad:#e8857a}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font-family:Heebo,system-ui,Arial,sans-serif;font-weight:400;color:var(--txt);background:var(--bg);min-height:100vh;min-height:100dvh}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 600px at 85% -10%,#2a2012 0,transparent 60%),radial-gradient(800px 500px at 0% 110%,#1a1408 0,transparent 60%),var(--bg)}
.bg .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 18s ease-in-out infinite alternate}
.bg .o1{width:420px;height:420px;background:#b48a3c;top:-120px;right:-100px}
.bg .o2{width:360px;height:360px;background:#5a4420;bottom:-120px;left:-80px;animation-delay:-6s}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(#d8b86a0d 1px,transparent 1px),linear-gradient(90deg,#d8b86a0d 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.bg svg.road{position:absolute;bottom:0;left:0;width:100%;height:160px;opacity:.5}
.dash{stroke-dasharray:40 40;animation:road 2.5s linear infinite}
@keyframes road{to{stroke-dashoffset:-80}}
@keyframes float{to{transform:translate(-40px,50px) scale(1.1)}}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 70px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;transition:padding .6s ease}
body.has .wrap{justify-content:flex-start;padding-top:18px}
.hero{text-align:center;transition:all .5s ease}
.emblem{width:92px;height:92px;margin:0 auto 14px;filter:drop-shadow(0 0 18px #d8b86a66);transition:all .5s}
body.has .emblem{width:52px;height:52px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:clamp(28px,7vw,48px);line-height:1.15;margin:0 0 10px;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
body.has h1{font-size:clamp(22px,5vw,30px)}
.sub{color:var(--mut);font-size:15px;font-weight:300;max-width:520px;margin:0 auto 26px;line-height:1.6}
body.has .sub{display:none}
.sbox{position:sticky;top:10px;z-index:5;max-width:560px;width:100%;margin:0 auto;padding:8px;border-radius:22px;background:linear-gradient(135deg,#d8b86a55,#d8b86a10 40%,#d8b86a44);box-shadow:0 20px 60px #000a,0 0 40px #d8b86a1f}
form{display:flex;gap:8px;background:#0d0c10f2;border-radius:16px;padding:6px;backdrop-filter:blur(10px)}
.plate{flex:1 1 auto;min-width:0;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;background:#f2c94c;border:2px solid #1a1a1a;box-shadow:inset 0 0 0 1px #fff6}
.plate i{flex:0 0 30px;background:#1f4fa8;color:#fff;font:700 10px Heebo;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;gap:2px}
input{flex:1;min-width:0;font:700 clamp(20px,5.5vw,26px) Heebo,monospace;letter-spacing:3px;text-align:center;padding:12px 6px;border:0;background:transparent;color:#111;outline:none;direction:ltr}
input::placeholder{color:#0005}
button{flex:0 0 auto;font:700 17px Heebo;padding:0 24px;border:0;border-radius:12px;color:#1a1306;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold3));cursor:pointer;box-shadow:0 6px 20px #d8b86a44;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:0 10px 30px #d8b86a66}
button:disabled{opacity:.6}
.status{color:var(--mut);margin-top:14px;text-align:center;min-height:1.4em;font-size:14px}
.card{background:linear-gradient(180deg,#16141acc,#0e0d11e6);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 10px 40px #0009,inset 0 1px 0 #ffffff08;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#out .card:nth-child(2){animation-delay:.05s}#out .card:nth-child(3){animation-delay:.1s}#out .card:nth-child(4){animation-delay:.15s}#out .card:nth-child(5){animation-delay:.2s}#out .card:nth-child(6){animation-delay:.25s}#out .card:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.veh{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.veh div{background:#0b0a0d;border:1px solid var(--line);border-radius:14px;padding:10px 12px;word-break:break-word}
.veh b{display:block;color:var(--gold);font-size:11px;font-weight:500;letter-spacing:.05em;margin-bottom:3px}
.cats{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:900px){.cats{grid-template-columns:1fr 1fr;gap:0 16px}.cats .wide{grid-column:1/-1}}
.cat h2{margin:0 0 12px;font:700 21px "Frank Ruhl Libre",serif;display:flex;align-items:center;gap:12px;color:var(--gold2)}
.ic{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#3a2e16,#16120a);border:1px solid #d8b86a55;box-shadow:0 0 18px #d8b86a22}
.ic svg{width:22px;height:22px;stroke:var(--gold2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.sec h3{margin:0 0 6px;font-size:15px;font-weight:500;color:var(--gold)}
.kv{display:flex;gap:10px;padding:5px 0;flex-wrap:wrap;border-bottom:1px dashed #2a241955}
.kv span:first-child{color:var(--mut);min-width:100px;font-size:13px}
.kv span:last-child{flex:1 1 200px;word-break:break-word}
.liters{display:inline-block;padding:2px 12px;border-radius:999px;background:linear-gradient(180deg,#d8b86a2a,#d8b86a10);border:1px solid #d8b86a88;color:var(--gold2);font-weight:700}
.miss{color:var(--bad)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{text-decoration:none;color:var(--txt);font-size:13px;padding:9px 14px;border-radius:999px;border:1px solid #d8b86a66;background:#d8b86a12;transition:all .25s;word-break:break-word}
.links a:hover{background:#d8b86a2a;box-shadow:0 0 18px #d8b86a44;color:var(--gold2)}
.meta{color:var(--mut);font-size:12px;margin-top:12px;line-height:1.6;word-break:break-word}
.meta a{color:var(--gold)}
.warn{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:10px;background:#f0b54a14;border:1px solid var(--warn);color:var(--warn);font-weight:500;font-size:14px}
.err{color:var(--bad)}
.mut{color:var(--mut)}
.empty{color:var(--mut);font-size:14px;padding:4px 0}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;vertical-align:-2px;border:1px solid #fff5;box-shadow:0 0 8px currentColor}
.conf{border-color:var(--qc);box-shadow:0 0 30px color-mix(in srgb,var(--qc) 25%,transparent)}
.cbig{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cbadge{font:900 22px Heebo;padding:6px 16px;border-radius:999px;background:var(--qc);color:#120e05}
.cpct{font:900 clamp(24px,6vw,34px) Heebo;color:var(--qc)}
.ctxt{font-size:17px;font-weight:700;margin-top:10px;line-height:1.5}
.cnote{font-size:11px;color:var(--mut);margin-top:6px}
.qs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:14px;padding:9px 12px;border-radius:12px;background:#0b0a0d;border:1px solid var(--line);border-right:4px solid var(--qc);font-size:12px;color:var(--mut)}
.qs b{color:var(--qc)}.qp{font:900 16px Heebo;color:var(--qc)}.stars{color:var(--qc);letter-spacing:1px}.stars i{font-style:normal;color:#3a342a}.qs .dot{opacity:.5}
.src{margin-top:4px}.src summary{font-size:11px}.src div{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5;word-break:break-word}
details summary{cursor:pointer;color:var(--gold);font-size:12px}
footer{text-align:center;color:#6b6456;font-size:11px;margin-top:26px;letter-spacing:.1em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bimgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.bimg{display:inline-flex;align-items:center;gap:6px;background:#f6f9fc;border:1px solid #dde6ee;border-radius:8px;padding:3px 8px 3px 3px}.bcap{font-size:12px;line-height:1.3;color:#334}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div>
<svg class="road" viewBox="0 0 1200 160" preserveAspectRatio="none"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#d8b86a" stop-opacity="0"/><stop offset=".5" stop-color="#d8b86a"/><stop offset="1" stop-color="#d8b86a" stop-opacity="0"/></linearGradient></defs><path d="M0 120 Q600 60 1200 120" stroke="url(#rg)" stroke-width="1.5" fill="none"/><path class="dash" d="M0 140 Q600 90 1200 140" stroke="url(#rg)" stroke-width="2" fill="none"/></svg></div>
<div class="wrap">
<header class="hero">
<svg class="emblem" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dfa8"/><stop offset=".6" stop-color="#d8b86a"/><stop offset="1" stop-color="#9c7a35"/></linearGradient></defs><circle cx="50" cy="50" r="46" fill="none" stroke="url(#gg)" stroke-width="1.5"/><circle cx="50" cy="50" r="40" fill="none" stroke="url(#gg)" stroke-width=".6" stroke-dasharray="2 4"/><path d="M50 22 C50 22 32 44 32 57 a18 18 0 0 0 36 0 C68 44 50 22 50 22Z" fill="url(#gg)" opacity=".92"/><path d="M42 58 a8 8 0 0 0 8 8" stroke="#1a1306" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
<div class="eyebrow">Oil &amp; Fluids</div>
<h1>שמנים ונוזלים לפי מספר רכב</h1>
<div class="sub">הקלידו מספר רישוי (ספרות בלבד) וקבלו את סוגי השמנים והנוזלים המומלצים והכמויות לפי הקטלוג.</div>
</header>
<div class="sbox"><form id="f"><label class="plate"><i>IL<span>🇮🇱</span></i><input id="plate" inputmode="numeric" autocomplete="off" placeholder="12-345-67" maxlength="12" aria-label="מספר רכב" autofocus></label><button id="go">חיפוש</button></form></div>
<div id="status" class="status"></div>
<div id="out"></div>
<footer>שימוש פנימי בלבד · נתוני רישוי: data.gov.il</footer>
</div>
<script src="bulbimg.js"></script>
<script>
const API='https://data.gov.il/api/3/action/datastore_search';
const RES_MAIN='053cea08-09bc-40ec-8f7a-156f0677aff3', RES_PI='03adc637-b6fe-402b-9937-7c3d3afc9140';
let DATA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadData(){ if(!DATA){ $('status').textContent='טוען קטלוג…'; DATA=await (await fetch('data.json',{cache:'force-cache'})).json(); try{BW=await (await fetch('bulbs_wipers.json',{cache:'no-cache'})).json();}catch(e){BW={};} } return DATA; }
async function reg(res,plate){
  const u=API+'?resource_id='+res+'&filters='+encodeURIComponent(JSON.stringify({mispar_rechev:Number(plate)}));
  const r=await fetch(u); if(!r.ok) throw new Error('registry '+r.status);
  const j=await r.json(); return (j.result&&j.result.records||[])[0]||null;
}
const up=s=>String(s??'').trim().toUpperCase();
function findRows(v,pi){
  const D=DATA;
  if(!pi){ const id=D.keys[[v.tozeret_cd,v.degem_cd,v.shnat_yitzur,up(v.degem_manoa)].join('|')]; return id?[{id,how:''}]:[]; }
  const c=D.alt[[v.tozeret_cd,up(v.degem_nm),up(v.degem_manoa)].join('|')]||[];
  const y=Number(v.shnat_yitzur);
  return c.filter(id=>{const r=D.rows[id];const a=parseInt(r.year_from),b=parseInt(r.year_to||r.year_from);return !(a&&b)||(y>=a&&y<=b);})
          .map(id=>({id,how:'יבוא אישי: התאמה לפי יצרן + דגם + קוד מנוע ושנת ייצור בטווח השורה בקטלוג (אין קוד דגם במאגר יבוא אישי) – מומלץ לאמת.'}));
}
function bwModel(v){const y=Number(v.shnat_yitzur);for(const e of (BW.__models||[])){const tc=[].concat(e.tozeret_cd).map(String);if(!tc.includes(String(v.tozeret_cd)))continue;if(!new RegExp(e.kinuy_re,'i').test(v.kinuy_mishari||v.degem_nm||''))continue;if(e.year_from&&y<e.year_from)continue;if(e.year_to&&y>e.year_to)continue;if(e.degem_cd&&!e.degem_cd.map(String).includes(String(v.degem_cd)))continue;return e.data;}return null;}
const MISS='<span class="miss">לא נמצא בקטלוג</span>';

const CJK=/[\u3040-\u30ff\u3400-\u9fff\uff01-\uff60\u3000-\u303f]/;
const JW=[['オイルフィルター同時交換時','עם החלפת פילטר'],['オイル交換時','ללא פילטר'],['推奨オイル','שמן מומלץ'],['参考値','ערך לעיון'],['または','או'],['約','כ־']];
function clean(x){let t=String(x);for(const [j,h] of JW)t=t.split(j).join(' '+h+' ');
 t=t.replace(/[（]/g,'(').replace(/[）]/g,')').replace(/[：]/g,':').replace(/[、，]/g,',').replace(/[［]/g,'[').replace(/[］]/g,']');
 t=t.replace(/[\u3040-\u30ff\u3400-\u9fff\uff01-\uff60\u3000-\u303f\u2160-\u217f]+/g,' ');
 for(let i=0;i<3;i++)t=t.replace(/\(\s*[,:;=\/·\-]*\s*\)/g,'').replace(/\[\s*\]/g,'').replace(/\s*=\s*(?=[),;]|$)/g,'').replace(/(^|[;\/,:])\s*[,:;\/=]+/g,'$1');
 t=t.replace(/\(\s*[,;:]\s*/g,'(').replace(/^\s*או\s+/,'').replace(/([^\s(])\(/g,'$1 (').replace(/\)(?=[^\s,;:)\]])/g,') ').replace(/\s+([,;:)])/g,'$1').replace(/\(\s+/g,'(').replace(/\s{2,}/g,' ').replace(/^[\s,;:\/=·\-]+|[\s,;:\/=·(]+$/g,'').trim();return t;}
const src=x=>'<details class="src"><summary>טקסט מקור</summary><div dir="auto">'+esc(x)+'</div></details>';
let ROW=null,BW={};
const hv=f=>{const H=ROW&&ROW.H||{};return H[f];};
const tx=(f,x)=>{x=x===undefined?ROW[f]:x;if(!x)return MISS;const h=hv(f);if(h)return esc(clean(h))+src(x);if(h==='')return '<span class="mut">ראו טקסט מקור</span>'+src(x);return val(x);};
const txl=f=>{const x=ROW[f];if(!x)return '<span class="miss">אין כמות</span>';const h=hv(f);if(!h)return lit(x);const c=clean(h);return (/\d/.test(c)?'<span class="liters">'+esc(c)+'</span>':'<span class="mut">ראו טקסט מקור</span>')+src(x);};
const val=x=>{if(!x)return MISS;if(!CJK.test(x))return esc(x);const c=clean(x);return (c?esc(c):'<span class="mut">ראו טקסט מקור</span>')+src(x);};
const lit=x=>{if(!x)return '<span class="miss">אין כמות</span>';const j=CJK.test(x),c=j?clean(x):x;const pill=/\d/.test(c)?'<span class="liters">'+esc(c)+(/[לL]/.test(c)?'':' ל׳')+'</span>':'<span class="mut">ראו טקסט מקור</span>';return pill+(j?src(x):'');};
const kv=(k,v)=>'<div class="kv"><span>'+k+'</span><span>'+v+'</span></div>';
const lk=a=>a&&a.length?'<div class="links">'+a.map(([t,u])=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t)+' · אוטו פוינט ←</a>').join('')+'</div>':'';

const CONF={'manual-verbatim':[90,'מועתק מספר הרכב','#5fd08a','ביטחון גבוה – הנתונים הועתקו מספר הרכב, אך עדיין אינם מובטחים ב־100%.'],'high':[90,'גבוהה','#5fd08a','רמת ביטחון גבוהה – סביר מאוד שנכון, אך אינו מובטח ב־100%; במקרה ספק לאמת מול ספר הרכב.'],'medium-high':[75,'בינונית־גבוהה','#b9d36a','רמת ביטחון בינונית־גבוהה – סביר שנכון, אך ההתאמה אינה מובטחת; מומלץ לאמת מול ספר הרכב.'],'medium':[50,'בינונית','#f0b54a','רמת ביטחון בינונית – ההתאמה אינה מובטחת, יש לאמת מול ספר הרכב.'],'low':[25,'נמוכה','#e8857a','ביטחון נמוך – לאמת בהכרח מול ספר הרכב לפני מילוי.']};
function conf(r){const c=String(r.confidence||'').trim();if(c.startsWith('manual-verbatim; primary'))return [75,'ספר הרכב (תקן שמן ראשי חסר)','#b9d36a','הנתונים מספר הרכב, אך תקן השמן הראשי אינו מופיע בו – יש לאמת.'];return CONF[c.split(/[;\s]/)[0]]||[25,'לא ידועה','#e8857a','רמת הביטחון לא צוינה – לאמת בהכרח.'];}
function region(r){const t=[r.region_condition,r.source_title,r.source_url,r.notes].join(' '),id=r.row_id||'';
 if(/-JP\d*$/.test(id)||/[\u3040-\u30ff]/.test((r.source_title||'')+(r.source_url||'')))return 'מהדורה יפנית';
 if(/-(GB|UK|EU|DE|FI)\d*$/.test(id))return 'מהדורה אירופית';
 if(/-(US|CA)\d*$/.test(id))return 'מהדורה אמריקאית';
 if(/[\u0590-\u05ff]/.test(r.source_title||'')||/\.co\.il|\bisrael(i)? (edition|market|manual)/i.test(t))return 'מהדורה ישראלית';
 if(/japan|\bJDM\b|\.jp\b|\bJP\b/i.test(t))return 'מהדורה יפנית';
 if(/\b(USA|US|U\.S\.|North America|Canada)\b|\.com\/us|owners\.(honda|toyota|ford)\.com/i.test(t))return 'מהדורה אמריקאית';
 if(/\b(EU|Europe|European|UK|GBR|Germany|Deutschland|ECE)\b|\.co\.uk|\.de\b|\.fr\b|\.eu\b|ford_eu/i.test(t))return 'מהדורה אירופית';
 return 'אזור מהדורה לא צוין';}
function srcName(r){const h=hv('source_title'),o=r.source_title||'';if(h)return esc(clean(h));if(/[\u0590-\u05ff]/.test(o))return esc(o);if(h)return esc(clean(h));return '<span class="mut">מקור (ראו טקסט מקור)</span>';}
const stars=p=>{const n=Math.round(p/20);return '<span class="stars" aria-hidden="true">'+'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i></span>';};
function qstrip(r){const [p,l,c]=conf(r);return '<div class="qs" style="--qc:'+c+'"><span class="qp">'+p+'%</span>'+stars(p)+'<span>אמינות: <b>'+l+'</b></span><span class="dot">·</span><span>'+srcName(r)+'</span><span class="dot">·</span><span>'+region(r)+'</span></div>';}
function confTop(r){const [p,l,c,t]=conf(r);return '<div class="card conf" style="--qc:'+c+'"><div class="cbig"><span class="cbadge">'+l+'</span><span class="cpct">אמינות משוערת: '+p+'%</span></div><div class="ctxt">'+t+'</div><div class="cnote">האחוז הוא הערכה פנימית לפי סוג המקור ואופן ההתאמה לרכב – לא דיוק שנמדד בפועל.</div>'+qstrip(r)+'</div>';}
const SW=[[/green|ירוק|緑|vihr/i,'#3fbf5f'],[/pink|ורוד|ピンク/i,'#f08cc0'],[/purple|violet|סגול|紫/i,'#a064e0'],[/red|אדום|赤|punai/i,'#e04848'],[/orange|כתום|オレンジ/i,'#f08a2a'],[/yellow|צהוב|黄/i,'#f0d040'],[/blue|כחול|青|sini/i,'#3f7fe0']];
function swatch(c){const m=SW.filter(([re])=>re.test(c));return m.map(([,h])=>'<span class="sw" style="background:'+h+'"></span>').join('');}
const IC={"bulb":"<path d=\"M9 18h6M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/>","wiper":"<path d=\"M12 20 4 6\"/><path d=\"M3 20h18\"/><path d=\"M4 6c4-2 10-2 16 2\"/>","eng": "<path d=\"M4 10h3l2-3h6v3h3l2 2v5h-2v2h-4l-2-2H9l-1 2H4z\"/><path d=\"M11 7V4h4\"/>", "gear": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1\"/>", "diff": "<circle cx=\"12\" cy=\"12\" r=\"7\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M2 12h3M19 12h3\"/>", "tc": "<rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M2 9h5M2 15h5M17 12h5M12 2v5M12 17v5\"/>", "cool": "<path d=\"M12 3v11\"/><circle cx=\"12\" cy=\"17\" r=\"3.5\"/><path d=\"M8 20c-3 0-4-2-4-2M16 20c3 0 4-2 4-2M15 6h2M15 10h2\"/>", "brake": "<circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M5 6a9 9 0 0 0 0 12M19 6a9 9 0 0 1 0 12\"/>", "ps": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><path d=\"M3.5 10h6.5M14 10h6.5M12 14v7\"/>"};
function cat(title,body,k,w){return '<div class="card cat'+(w?' wide':'')+'"><h2><span class="ic"><svg viewBox="0 0 24 24">'+IC[k]+'</svg></span>'+title+'</h2>'+body+(body.indexOf('class="empty"')<0?qstrip(ROW):'')+'</div>';}
function render(v,pi,matches){
  let h='<div class="card"><div class="veh">'+
   [['יצרן',v.tozeret_nm],['דגם',v.kinuy_mishari||v.degem_nm],['קוד דגם',v.degem_nm],['שנת ייצור',v.shnat_yitzur],['קוד מנוע',v.degem_manoa],['נפח מנוע',v.nefach_manoa?v.nefach_manoa+' סמ״ק':''],['דלק',v.sug_delek_nm],['רמת גימור',v.ramat_gimur],['סוג יבוא',pi?(v.sug_yevu||'יבוא אישי'):'']]
   .filter(x=>x[1]).map(x=>'<div><b>'+x[0]+'</b>'+esc(x[1])+'</div>').join('')+'</div></div>';
  if(!matches.length) return h+'<div class="card"><h2 class="miss">לא נמצא בקטלוג</h2><div class="meta">אין לרכב זה התאמה בקטלוג השמנים. אין להסתמך על ניחוש – יש לבדוק בספר הרכב.</div></div>';
  if(matches.length>1) h+='<div class="card warn">נמצאו '+matches.length+' התאמות אפשריות בקטלוג – יש לבחור לפי הרכב בפועל.</div>';
  for(const m of matches){
    const r=DATA.rows[m.id], L=r.L||{}; ROW=r; r.row_id=m.id;
    h+='<div class="card"><div class="meta" style="margin-top:0">שורת קטלוג: <b>'+esc(m.id)+'</b> · '+esc([r.brand_en,r.model_en,(hv('engine_name_manual')?clean(hv('engine_name_manual')):clean(r.engine_name_manual||'')),r.year_from+(r.year_to?'–'+r.year_to:'')].filter(Boolean).join(' · '))+'</div>'+
       (m.how?'<div class="warn">'+esc(m.how)+'</div>':'')+'</div>'+confTop(r);
    h+='<div class="cats">';
    const has=f=>!!(r[f]&&String(r[f]).trim());
    const F=(lab,f,l)=>has(f)?kv(lab,(l?txl(f):tx(f))+(r.P&&r.P[f]?'<div class="mut" style="font-size:11px">הועבר משורת קטלוג אחות מאותו ספר בעלים ('+esc(r.P[f])+')</div>':'')):'';
    const EMPTY='<div class="empty">אין נתון בקטלוג לרכב זה</div>';
    const C=(t,body,k,w)=>{h+=body?cat(t,body,k,w):cat(t,EMPTY,k,w);};
    const vis=has('engine_oil_viscosity')?F('צמיגות','engine_oil_viscosity'):(r.VD?kv('צמיגות','<b>'+esc(r.VD.join(' / '))+'</b> <span class="mut">(נגזר מטקסט התקן/המוצר בקטלוג)</span>'):'');
    const eb=vis+F('תקן','engine_oil_spec')+F('מוצר מומלץ','engine_oil_oem_product')+F('כמות עם פילטר','engine_oil_cap_l_with_filter',1)+F('כמות בלי פילטר','engine_oil_cap_l_without_filter',1);
    C('שמן מנוע', eb?eb+(has('engine_oil_cap_l_with_filter')||has('engine_oil_cap_l_without_filter')?'':kv('כמות','<span class="miss">אין כמות</span>'))+lk(L.eng):'','eng');
    const g=[['mt','ידני'],['at','אוטומטי'],['dct','רובוטי כפול מצמד (DCT)'],['hybrid_transaxle','תמסורת היברידית']].filter(([k])=>has(k+'_fluid_spec')||has(k+'_fluid_cap_l')||has(k+'_cap_l'));
    C('שמן גיר', g.map(([k,t])=>{const cf=has(k+'_fluid_cap_l')?k+'_fluid_cap_l':k+'_cap_l';return '<div class="sec"><h3>'+t+'</h3>'+F('סוג/תקן',k+'_fluid_spec')+(has(cf)?F('כמות',cf,1):kv('כמות','<span class="miss">אין כמות</span>'))+lk(L[k])+'</div>';}).join(''),'gear',1);
    const two=(sp,cp,lks)=>{const x=F('סוג/תקן',sp)+F('כמות',cp,1);return x?x+(has(cp)?'':kv('כמות','<span class="miss">אין כמות</span>'))+lk(lks):'';};
    C('שמן דיפרנציאל', two('rear_diff_oil_spec','rear_diff_cap_l',L.rd),'diff');
    C('שמן טרנספר', two('transfer_case_oil_spec','transfer_case_cap_l',L.tc),'tc');
    const cc=has('coolant_color')?kv('צבע',swatch(r.coolant_color)+tx('coolant_color')):'';
    const cb=(has('coolant_spec')&&!has('coolant_color')&&swatch(r.coolant_spec)?kv('גוון',swatch(r.coolant_spec)):'')+F('סוג/תקן','coolant_spec')+cc+F('כמות','coolant_cap_l',1)+F('מעגל קירור משני','secondary_coolant_spec_cap');
    C('נוזל קירור', cb?cb+lk(L.cool):'','cool');
    const bb=F('סוג/תקן','brake_fluid_spec')+F('כמות','brake_fluid_cap_l',1)+F('נוזל מצמד','clutch_actuator_fluid');
    C('נוזל בלמים', bb?bb+lk(L.brake):'','brake');
    const pb=F('סוג/תקן','power_steering_fluid');
    C('נוזל הגה', pb?pb+lk(L.ps):'','ps');
    {const b=BW[m.id]||bwModel(v),sv=ROW;const E=x=>x!=null&&String(x).trim()!=='';
     const EM='<div class="empty">אין נתון בקטלוג</div>';const BI=t=>{const i=window.bulbIcons?window.bulbIcons(t):'';return '<b>'+esc(t)+'</b>'+(i?'<div class="bimgs">'+i+'</div>':'');};
     if(b){ROW=Object.assign({row_id:m.id,source_pdf_page:b.source_page},b);}
     const bl=b?(E(b.headlight_low)?kv('פנס ראשי – אור נמוך',BI(b.headlight_low)):'')+(E(b.headlight_high)?kv('פנס ראשי – אור גבוה',BI(b.headlight_high)):'')+(E(b.brake_light)?kv('אור בלימה',BI(b.brake_light)):'')+
       (Array.isArray(b.other_bulbs)?b.other_bulbs.filter(o=>o&&E(o.type)).map(o=>kv(esc(o.position||'נורה נוספת'),BI(o.type))).join(''):''):'';
     h+=cat('נורות',bl||EM,'bulb');
     const mm=x=>'<b>'+esc(x)+'</b> מ״מ';
     const wb=b?(E(b.front_wipers_driver_mm)?kv('מגב קדמי – נהג',mm(b.front_wipers_driver_mm)):'')+(E(b.front_wipers_passenger_mm)?kv('מגב קדמי – נוסע',mm(b.front_wipers_passenger_mm)):'')+(E(b.rear_wiper_mm)?kv('מגב אחורי',mm(b.rear_wiper_mm)):''):'';
     h+=cat('מגבים',wb||EM,'wiper');
     ROW=sv;}
    h+='</div>';
    h+='<div class="card meta">רמת ביטחון: <b>'+conf(r)[1]+'</b><br>מקור: '+(r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank" rel="noopener">'+srcName(r)+'</a>':srcName(r))+(/^[\d\s,.\-–]+$/.test(r.source_pdf_page||'')?' (עמ׳ '+esc(r.source_pdf_page)+')':'')+(r.source_title&&!/[\u0590-\u05ff]/.test(r.source_title)?src(r.source_title):'')+
       (r.region_condition?'<br>תנאי אזור: '+tx('region_condition'):'')+(r.notes?'<details><summary>הערות מהקטלוג</summary>'+tx('notes')+'</details>':'')+'</div>';
  }
  return h;
}
$('f').addEventListener('submit',async e=>{
  e.preventDefault(); const plate=$('plate').value.replace(/\D/g,'');
  $('out').innerHTML='';
  if(plate.length<5||plate.length>8){$('status').innerHTML='<span class="err">יש להקליד מספר רכב תקין (5–8 ספרות).</span>';return;}
  $('go').disabled=true;
  try{
    const dp=loadData();
    $('status').textContent='מחפש במאגר משרד התחבורה…';
    let v=await reg(RES_MAIN,plate), pi=false;
    if(!v){ v=await reg(RES_PI,plate); pi=!!v; }
    await dp;
    if(!v){$('status').innerHTML='<span class="err">מספר הרכב '+esc(plate)+' לא נמצא במאגר הרכבים הממשלתי.</span>';return;}
    $('status').textContent='רכב '+plate;
    document.body.classList.add('has');
    $('out').innerHTML=render(v,pi,findRows(v,pi));
  }catch(err){$('status').innerHTML='<span class="err">שגיאה בחיפוש: '+esc(err.message)+'. נסו שוב.</span>';}
  finally{$('go').disabled=false;}
});
</script>
